<!doctype html><html lang="fr-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f7f3e9"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Céliflor"><link rel="manifest" href="manifest.webmanifest"><title>Céliflor — Mon rucher</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#29271f;background:#f7f3e9}*{box-sizing:border-box}body{margin:0}header{background:#fffaf0;padding:18px 18px 12px;border-bottom:1px solid #e9dfca;position:sticky;top:0;z-index:3}h1{font-size:25px;margin:0;color:#7a5315}h2{font-size:21px;margin:4px 0 14px}h3{font-size:16px;margin:0 0 8px}p{line-height:1.45}.sub{color:#766d5e;font-size:13px}main{max-width:750px;margin:auto;padding:18px 14px 110px}.card{background:white;border:1px solid #e7dfd1;border-radius:15px;padding:15px;margin:12px 0;box-shadow:0 2px 8px #2e23090a}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stack{display:grid;gap:10px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#fff8e8;padding:13px 5px;text-align:center;border-radius:11px}.stat strong{display:block;font-size:24px;color:#8c6019}.stat span{font-size:11px;color:#766d5e}button,.btn{border:0;border-radius:10px;background:#a67523;color:white;padding:11px 14px;font-weight:650;font-size:14px;cursor:pointer}button.secondary{background:#f1e7d3;color:#62440f}button.outline{background:white;border:1px solid #d4c4a8;color:#62440f}button.small{padding:7px 10px;font-size:12px}nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:#fffdf8;border-top:1px solid #e7dfd1;padding:9px 4px max(10px,env(safe-area-inset-bottom));z-index:4}nav button{background:none;color:#827663;padding:7px 1px;font-size:11px;font-weight:600}nav button.active{color:#8e5d0c;background:#f8eedb}label{display:block;font-size:13px;font-weight:650;margin:12px 0 5px}input,select,textarea{width:100%;padding:11px;border:1px solid #d6cbb8;border-radius:9px;font:inherit;background:white;color:#29271f}textarea{min-height:76px}input[type=checkbox]{width:auto;transform:scale(1.15)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.day{min-height:66px;background:#f9f6ef;border:1px solid #eee6d8;border-radius:8px;padding:5px 2px;text-align:left;color:#332e23;font-weight:500;font-size:12px;overflow:hidden}.day.today{border:2px solid #a67523}.day.selected{background:#f1dfb8}.day.muted{opacity:.3}.day b{display:block;font-size:12px}.dot{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:9px;color:#78510f;margin-top:3px}.weekhead{text-align:center;color:#746a58;font-size:12px;padding:7px 0}.task{padding:11px 0;border-bottom:1px solid #f0e8dc}.task:last-child{border-bottom:0}.pill{display:inline-block;font-size:11px;border-radius:20px;background:#f3e4c7;padding:4px 8px;color:#76500d}.done{text-decoration:line-through;color:#8a887f}.hidden{display:none!important}.empty{color:#8a806f;font-style:italic}.notice{background:#fff2d8;border-left:3px solid #b58227;padding:11px;border-radius:7px;font-size:13px}.link{background:none;color:#85560d;padding:4px 0;text-decoration:underline}.guide{white-space:pre-line;font-size:14px;line-height:1.55}.toolbar{display:flex;gap:7px;flex-wrap:wrap}.toolbar button{flex:1}.checkline{display:flex;gap:9px;align-items:center;margin:9px 0;font-size:14px}@media(min-width:600px){.day{min-height:90px}.dot{font-size:11px}} </style></head><body>
<header><div class="row"><div><div class="sub">MIELLERIE</div><h1>⬡ Céliflor</h1></div><span class="pill">V0.1</span></div></header><main id="app"></main><nav id="nav"></nav><input type="file" id="restoreFile" accept="application/json" class="hidden">
<script>
'use strict';const KEY='celiflor_v01';const today=new Date();const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const season=[{month:2,day:20,title:'Préparer la sortie d’hiver',guide:'sortie'},{month:3,day:15,title:'Évaluer les réserves et la ponte (si météo favorable)',guide:'sortie'},{month:4,day:15,title:'Surveiller le développement et l’essaimage',guide:'division'},{month:5,day:10,title:'Évaluer l’opportunité de diviser',guide:'division'},{month:6,day:10,title:'Suivre les hausses et la miellée',guide:'inspection'},{month:7,day:15,title:'Évaluer récolte et surveillance varroa',guide:'varroa'},{month:8,day:15,title:'Contrôler réserves et préparation hivernale',guide:'hiver'},{month:9,day:15,title:'Finaliser la préparation hivernale',guide:'hiver'},{month:10,day:15,title:'Surveiller les protections extérieures',guide:'hiver'}];
const guides={inspection:{title:'Inspection rapide',body:'1. Vérifier la météo et limiter l’ouverture si les conditions sont mauvaises.\n2. Observer activité, réserves, couvain et indices de ponte.\n3. Rechercher des signes anormaux et noter les observations.\n4. Refermer proprement et programmer le suivi.'},nucleus:{title:'Installer un nucléus',body:'1. Préparer une ruche propre, adaptée à la taille de la colonie.\n2. Vérifier les cadres, les réserves et les signes de ponte avec le fournisseur.\n3. Installer les cadres dans le bon ordre et limiter le refroidissement.\n4. Prévoir une inspection de suivi; nourrir si nécessaire selon les ressources et la saison.'},queen:{title:'Introduire une reine',body:'1. Confirmer le besoin et vérifier l’absence d’une reine en place.\n2. Suivre la méthode de cage et de libération prescrite par le fournisseur.\n3. Limiter les perturbations pendant l’acceptation.\n4. Vérifier ensuite la ponte sans multiplier les ouvertures.'},division:{title:'Diviser une colonie',body:'1. Vérifier que la colonie est forte, saine et que la saison laisse assez de temps.\n2. Prévoir une reine fécondée ou une méthode fiable de remérage.\n3. Répartir couvain, abeilles et réserves de façon adaptée.\n4. Contrôler la reprise et la ponte; ne pas affaiblir une colonie insuffisamment développée.'},varroa:{title:'Surveillance du varroa',body:'1. Mesurer l’infestation avec une méthode reconnue.\n2. Interpréter selon la saison et les seuils recommandés localement.\n3. Choisir seulement un traitement homologué et respecter son étiquette.\n4. Vérifier l’efficacité après traitement et consigner le résultat.'},hiver:{title:'Préparer l’hivernage',body:'1. Évaluer la force, la santé et les réserves.\n2. Compléter le nourrissement au moment approprié.\n3. Vérifier protections contre rongeurs, humidité et vent.\n4. Éviter les ouvertures inutiles par temps froid.'},sortie:{title:'Sortie d’hiver',body:'1. Observer d’abord l’activité extérieure et l’état du matériel.\n2. Vérifier les réserves sans refroidir la colonie.\n3. Attendre des conditions favorables pour l’inspection approfondie.\n4. Noter les pertes, la force et les besoins de suivi.'}};
const initial=()=>({version:1,hives:[{id:uid(),name:'Ruche 1',location:'Rucher principal',queen:'Inconnue',notes:''},{id:uid(),name:'Ruche 2',location:'Rucher principal',queen:'Inconnue',notes:''}],inspections:[],tasks:[],generatedYears:[]});let db;try{db=JSON.parse(localStorage.getItem(KEY))||initial();if(!Array.isArray(db.hives)||!Array.isArray(db.tasks))throw Error('invalid')}catch(e){db=initial();alert('Données locales illisibles. Une nouvelle session a été créée. Importez une sauvegarde si nécessaire.')}let view='home',selectedHive=null,selectedGuide=null,calDate=new Date(today.getFullYear(),today.getMonth(),1),calSelected=iso(today),calMode='month';
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Enregistrement impossible : stockage indisponible ou plein. Exportez vos données.');return false}return true}function generate(year){if(db.generatedYears.includes(year))return;for(const s of season){const date=`${year}-${String(s.month+1).padStart(2,'0')}-${String(s.day).padStart(2,'0')}`;db.tasks.push({id:uid(),title:s.title,date,hiveId:'',done:false,guide:s.guide,auto:true})}db.generatedYears.push(year);save()}generate(today.getFullYear());generate(today.getFullYear()+1);
function setView(v){view=v;selectedHive=null;selectedGuide=null;render()}function render(){const items=[['home','⌂','Accueil'],['calendar','▦','Calendrier'],['hives','⬡','Ruches'],['guides','☷','Guides'],['more','⋯','Plus']];document.getElementById('nav').innerHTML=items.map(([id,ic,t])=>`<button class="${view===id?'active':''}" onclick="setView('${id}')">${ic}<br>${t}</button>`).join('');const app=document.getElementById('app');app.innerHTML=({home:homeView,calendar:calendarView,hives:hivesView,guides:guidesView,more:moreView}[view])();}
function taskRow(t){const hive=db.hives.find(h=>h.id===t.hiveId);return `<div class="task"><div class="row"><label class="checkline" style="margin:0;flex:1"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.id}',this.checked)"><span class="${t.done?'done':''}">${esc(t.title)}<small class="sub" style="display:block">${esc(t.date)} ${hive?'· '+esc(hive.name):'· Toutes les ruches'}</small></span></label><button class="secondary small" onclick="editTask('${t.id}')">Modifier</button></div>${t.guide?`<button class="link" onclick="openGuide('${t.guide}')">Voir le guide →</button>`:''}</div>`}function upcoming(){return db.tasks.filter(t=>!t.done).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,6)}function homeView(){return `<h2>Mon rucher</h2><div class="stats"><div class="stat"><strong>${db.hives.length}</strong><span>Ruches</span></div><div class="stat"><strong>${db.tasks.filter(t=>!t.done&&t.date<iso(today)).length}</strong><span>En retard</span></div><div class="stat"><strong>${db.inspections.length}</strong><span>Inspections</span></div></div><div class="card"><div class="row"><h3>Prochaines opérations</h3><button class="secondary small" onclick="setView('calendar')">Calendrier</button></div>${upcoming().map(taskRow).join('')||'<p class="empty">Aucune tâche prévue.</p>'}</div><div class="card"><h3>Mes ruches</h3>${db.hives.map(h=>`<div class="row task"><span>${esc(h.name)} <small class="sub">${esc(h.location)}</small></span><button class="secondary small" onclick="openHive('${h.id}')">Ouvrir</button></div>`).join('')}<button style="margin-top:12px" onclick="setView('hives')">Gérer mes ruches</button></div><div class="notice">Les échéances saisonnières sont des exemples indicatifs pour le sud du Québec, non des prescriptions. Adapte-les à la météo, aux colonies et aux recommandations locales.</div>`}
function calendarView(){const y=calDate.getFullYear(),m=calDate.getMonth();generate(y);const title=calDate.toLocaleDateString('fr-CA',{month:'long',year:'numeric'});let body='';if(calMode==='month'){const offset=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate();body=`<div class="calendar">${['L','M','M','J','V','S','D'].map(x=>`<div class="weekhead">${x}</div>`).join('')}${Array.from({length:Math.ceil((offset+days)/7)*7},(_,i)=>{const d=i-offset+1;if(d<1||d>days)return '<div></div>';const date=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,events=db.tasks.filter(t=>t.date===date);return `<button class="day ${date===calSelected?'selected':''} ${date===iso(today)?'today':''}" onclick="pickDay('${date}')"><b>${d}</b>${events.slice(0,2).map(t=>`<span class="dot">${t.done?'✓':'•'} ${esc(t.title)}</span>`).join('')}${events.length>2?`<span class="dot">+${events.length-2}</span>`:''}</button>`}).join('')}</div>`}else{const chosen=new Date(calSelected+'T12:00:00'),offset=(chosen.getDay()+6)%7;chosen.setDate(chosen.getDate()-offset);body='<div class="stack">'+Array.from({length:7},(_,i)=>{const d=new Date(chosen);d.setDate(d.getDate()+i);const date=iso(d);return `<button class="secondary" style="text-align:left" onclick="pickDay('${date}')">${d.toLocaleDateString('fr-CA',{weekday:'long',day:'numeric',month:'short'})} — ${db.tasks.filter(t=>t.date===date).length} tâche(s)</button>`}).join('')+'</div>'}const selectedTasks=db.tasks.filter(t=>t.date===calSelected);return `<div class="row"><h2>Calendrier</h2><button class="secondary small" onclick="newTask()">+ Tâche</button></div><div class="card"><div class="row"><button class="secondary small" onclick="moveMonth(-1)">‹</button><strong>${esc(title)}</strong><button class="secondary small" onclick="moveMonth(1)">›</button></div><div class="toolbar" style="margin:12px 0"><button class="${calMode==='month'?'':'secondary'}" onclick="calMode='month';render()">Mois</button><button class="${calMode==='week'?'':'secondary'}" onclick="calMode='week';render()">Semaine</button></div>${body}</div><div class="card"><h3>${new Date(calSelected+'T12:00:00').toLocaleDateString('fr-CA',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</h3>${selectedTasks.map(taskRow).join('')||'<p class="empty">Aucune tâche à cette date.</p>'}<button class="secondary" onclick="newTask('${calSelected}')">+ Ajouter une tâche</button></div>`}
function moveMonth(n){calDate=new Date(calDate.getFullYear(),calDate.getMonth()+n,1);calSelected=iso(calDate);render()}function pickDay(d){calSelected=d;render()}function toggleTask(id,val){const t=db.tasks.find(t=>t.id===id);if(t){t.done=val;t.completedAt=val?new Date().toISOString():null;save();render()}}function taskForm(t){return `<form id="taskForm"><label>Opération</label><input name="title" required value="${esc(t.title||'')}"><label>Date</label><input type="date" name="date" required value="${esc(t.date||calSelected)}"><label>Ruche concernée</label><select name="hiveId"><option value="">Toutes les ruches</option>${db.hives.map(h=>`<option value="${h.id}" ${t.hiveId===h.id?'selected':''}>${esc(h.name)}</option>`).join('')}</select><label>Guide associé</label><select name="guide"><option value="">Aucun</option>${Object.entries(guides).map(([id,g])=>`<option value="${id}" ${t.guide===id?'selected':''}>${esc(g.title)}</option>`).join('')}</select><div class="toolbar" style="margin-top:15px"><button type="submit">Enregistrer</button><button type="button" class="secondary" onclick="render()">Annuler</button>${t.id?'<button type="button" class="outline" onclick="deleteTask(\''+t.id+'\')">Supprimer</button>':''}</div></form>`}function newTask(date){const t={date:date||calSelected,title:'',hiveId:'',guide:''};document.getElementById('app').innerHTML=`<h2>Nouvelle tâche</h2><div class="card">${taskForm(t)}</div>`;document.getElementById('taskForm').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));db.tasks.push({id:uid(),...d,done:false,auto:false});save();setView('calendar')}}function editTask(id){const t=db.tasks.find(x=>x.id===id);if(!t)return;view='calendar';document.getElementById('app').innerHTML=`<h2>Modifier l'opération</h2><div class="card">${taskForm(t)}</div>`;document.getElementById('taskForm').onsubmit=e=>{e.preventDefault();Object.assign(t,Object.fromEntries(new FormData(e.target)));save();setView('calendar')}}function deleteTask(id){if(confirm('Supprimer cette tâche?')){db.tasks=db.tasks.filter(t=>t.id!==id);save();setView('calendar')}}
function hivesView(){if(selectedHive)return hiveDetail(selectedHive);return `<div class="row"><h2>Mes ruches</h2><button class="small" onclick="newHive()">+ Ruche</button></div>${db.hives.map(h=>`<div class="card"><div class="row"><div><h3>${esc(h.name)}</h3><div class="sub">${esc(h.location)} · Reine : ${esc(h.queen)}</div><div class="sub">${db.inspections.filter(i=>i.hiveId===h.id).length} inspections</div></div><button class="secondary" onclick="openHive('${h.id}')">Voir →</button></div></div>`).join('')}`}
function openHive(id){selectedHive=id;view='hives';render()}function hiveDetail(id){const h=db.hives.find(h=>h.id===id);if(!h){selectedHive=null;return hivesView()}const inspections=db.inspections.filter(i=>i.hiveId===id).sort((a,b)=>b.date.localeCompare(a.date));return `<button class="link" onclick="selectedHive=null;render()">← Toutes les ruches</button><h2>${esc(h.name)}</h2><div class="card"><p><b>Rucher :</b> ${esc(h.location)}<br><b>Reine :</b> ${esc(h.queen)}</p><p>${esc(h.notes)}</p><div class="toolbar"><button onclick="newInspection('${id}')">+ Inspection</button><button class="secondary" onclick="editHive('${id}')">Modifier</button></div></div><h3>Historique</h3>${inspections.map(i=>`<div class="card"><div class="row"><b>${esc(i.date)}</b><span class="pill">${esc(i.strength)}</span></div><p class="sub">Reine : ${esc(i.queen)} · Couvain : ${esc(i.brood)} · Réserves : ${esc(i.food)} · Santé : ${esc(i.health)}</p><p>${esc(i.notes)}</p><button class="link" onclick="deleteInspection('${i.id}')">Supprimer cette inspection</button></div>`).join('')||'<p class="empty">Aucune inspection enregistrée.</p>'}`}
function hiveForm(h){return `<form id="hiveForm"><label>Nom</label><input required name="name" value="${esc(h.name||'')}"><label>Rucher / emplacement</label><input name="location" value="${esc(h.location||'')}"><label>Reine</label><input name="queen" value="${esc(h.queen||'')}"><label>Notes</label><textarea name="notes">${esc(h.notes||'')}</textarea><div class="toolbar" style="margin-top:15px"><button>Enregistrer</button><button type="button" class="secondary" onclick="selectedHive=null;render()">Annuler</button></div></form>`}function newHive(){selectedHive=null;document.getElementById('app').innerHTML=`<h2>Ajouter une ruche</h2><div class="card">${hiveForm({location:'Rucher principal'})}</div>`;document.getElementById('hiveForm').onsubmit=e=>{e.preventDefault();db.hives.push({id:uid(),...Object.fromEntries(new FormData(e.target))});save();render()}}function editHive(id){const h=db.hives.find(x=>x.id===id);document.getElementById('app').innerHTML=`<h2>Modifier ${esc(h.name)}</h2><div class="card">${hiveForm(h)}</div>`;document.getElementById('hiveForm').onsubmit=e=>{e.preventDefault();Object.assign(h,Object.fromEntries(new FormData(e.target)));save();render()}}
function newInspection(id){const date=iso(today);document.getElementById('app').innerHTML=`<h2>Inspection — ${esc(db.hives.find(h=>h.id===id).name)}</h2><div class="card"><form id="inspectionForm"><label>Date</label><input name="date" type="date" value="${date}" required>${[['queen','Reine / ponte',['Reine vue','Indices de ponte','Présence incertaine','Non inspecté']],['strength','Force de la colonie',['Faible','Moyenne','Forte']],['brood','Couvain',['Normal','Anomalie','Non inspecté']],['food','Réserves',['Faibles','Suffisantes','Abondantes','Non inspectées']],['health','État sanitaire',['Aucun signe apparent','Observation à surveiller','Problème suspecté','Non évalué']]].map(([name,label,opts])=>`<label>${label}</label><select name="${name}">${opts.map(x=>`<option>${x}</option>`).join('')}</select>`).join('')}<label>Opérations et observations</label><textarea name="notes" placeholder="Ex. : nourrissement, cadres, varroa, comportement..."></textarea><label class="checkline"><input type="checkbox" name="followup"> Ajouter une tâche de suivi dans 7 jours</label><div class="toolbar"><button>Enregistrer</button><button type="button" class="secondary" onclick="render()">Annuler</button></div></form></div>`;document.getElementById('inspectionForm').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const follow=!!d.followup;delete d.followup;db.inspections.push({id:uid(),hiveId:id,...d,createdAt:new Date().toISOString()});if(follow){const dt=new Date(d.date+'T12:00:00');dt.setDate(dt.getDate()+7);db.tasks.push({id:uid(),title:'Suivi après inspection',date:iso(dt),hiveId:id,done:false,guide:'inspection',auto:false})}save();render()}}function deleteInspection(id){if(confirm('Supprimer cette inspection?')){db.inspections=db.inspections.filter(i=>i.id!==id);save();render()}}
function openGuide(id){selectedGuide=id;view='guides';render()}function guidesView(){if(selectedGuide&&guides[selectedGuide]){const g=guides[selectedGuide];return `<button class="link" onclick="selectedGuide=null;render()">← Tous les guides</button><div class="card"><h2>${esc(g.title)}</h2><p class="guide">${esc(g.body)}</p><div class="notice">Aide-mémoire général : valider les recommandations avec des sources apicoles québécoises à jour et adapter à l'état réel de la colonie.</div></div>`}return `<h2>Guides pratiques</h2><p class="sub">Procédures courtes, accessibles aussi depuis les tâches du calendrier.</p>${Object.entries(guides).map(([id,g])=>`<div class="card row"><b>${esc(g.title)}</b><button class="secondary small" onclick="openGuide('${id}')">Lire →</button></div>`).join('')}`}
function downloadBackup(){const data=JSON.stringify(db,null,2),blob=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`celiflor-sauvegarde-${iso(today)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function moreView(){return `<h2>Paramètres et sauvegardes</h2><div class="card"><h3>Sauvegarde de mes données</h3><p>Les données sont enregistrées dans ce navigateur sur cet appareil. Exportez régulièrement une copie et conservez-la dans Fichiers ou iCloud Drive.</p><div class="stack"><button onclick="downloadBackup()">Exporter une sauvegarde JSON</button><button class="secondary" onclick="document.getElementById('restoreFile').click()">Importer une sauvegarde</button></div></div><div class="card"><h3>Développement futur</h3><p>Récoltes, inventaire, miel baratté, ventes, coûts, projets et plan d'affaires.</p></div><div class="notice">Important : une suppression des données du navigateur ou un changement de téléphone peut effacer cet historique. Les sauvegardes ne sont pas automatiques.</div>`}
document.getElementById('restoreFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(data.version!==1||!Array.isArray(data.hives)||!Array.isArray(data.inspections)||!Array.isArray(data.tasks)||!Array.isArray(data.generatedYears))throw Error('Format non reconnu');if(!confirm('Remplacer toutes les données actuelles par cette sauvegarde?'))return;db=data;save();setView('home');alert('Sauvegarde importée.')}catch(err){alert('Importation impossible : '+err.message)}finally{e.target.value=''}});render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
