<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Celiflore">
<meta name="theme-color" content="#f5a623">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23f5a623'/%3E%3Ctext x='50' y='70' font-size='60' text-anchor='middle'%3E🐝%3C/text%3E%3C/svg%3E">
<title>Celiflore</title>
<style>
:root{--o:#f5a623;--d:#7a4b00;--bg:#fff8e8;--c:#fff;--g:#8a8a8a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:#222;padding-bottom:80px}
header{background:var(--o);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;font-size:20px;font-weight:700;position:sticky;top:0;z-index:5}
main{padding:12px;max-width:700px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #ddd;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{flex:1;border:0;background:none;padding:10px 0;font-size:12px;color:var(--g)}
nav button span{display:block;font-size:22px}
nav button.on{color:var(--o);font-weight:700}
.card{background:var(--c);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px #0001}
h2{font-size:16px;margin:14px 0 8px;color:var(--d)}
button.p{background:var(--o);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-size:15px;font-weight:600}
button.s{background:#eee;border:0;border-radius:10px;padding:8px 12px;font-size:14px}
button.x{background:none;border:0;color:#c00;font-size:18px}
input,select,textarea{width:100%;padding:10px;margin:4px 0 8px;border:1px solid #ccc;border-radius:10px;font-size:16px;background:#fff}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1}
.small{font-size:12px;color:var(--g)}
.ly{font-size:12px;color:var(--o);font-weight:600}
.tag{display:inline-block;background:#ffe9b8;color:var(--d);border-radius:8px;padding:2px 7px;font-size:11px;margin:2px 2px 0 0}
.banner{background:#fff3d1;border-left:5px solid var(--o)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:11px;color:var(--g)}
.cal .d{padding:8px 0;border-radius:10px;font-size:14px;position:relative;background:#fafafa}
.cal .d.today{border:2px solid var(--o)}
.cal .d.sel{background:var(--o);color:#fff}
.cal .d .dot{position:absolute;bottom:2px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#2e9e4f}
.cal .d .dot.todo{background:#e8590c}
.done{text-decoration:line-through;color:var(--g)}
.tabv{display:none}.tabv.on{display:block}
li{margin:3px 0}
ul{padding-left:18px;margin:6px 0}
</style>
</head>
<body>
<header id="titre">🐝 Celiflore</header>
<main>

<!-- CALENDRIER -->
<section id="t-cal" class="tabv on">
  <div class="card banner" id="weekend"></div>
  <div class="card">
    <div class="row">
      <button class="s" onclick="moisPrec()">◀</button>
      <div class="grow" style="text-align:center;font-weight:700" id="moisLabel"></div>
      <button class="s" onclick="moisSuiv()">▶</button>
    </div>
    <div class="cal" id="cal" style="margin-top:8px"></div>
    <div class="small" style="margin-top:6px">🟠 à faire &nbsp; 🟢 fait</div>
  </div>
  <h2 id="jourLabel"></h2>
  <div id="tachesJour"></div>
  <div class="card">
    <b>Nouvelle tâche</b>
    <input id="nt-titre" placeholder="Titre (ex: Première inspection)" list="suggest">
    <datalist id="suggest"></datalist>
    <input id="nt-date" type="date">
    <select id="nt-ruche"></select>
    <textarea id="nt-notes" rows="2" placeholder="Notes"></textarea>
    <button class="p" onclick="ajoutTache()">Ajouter</button>
    <button class="s" onclick="exportICS()">📅 Export vers Calendrier iPhone (.ics)</button>
  </div>
  <div class="card">
    <button class="s" onclick="modeles()">✨ Ajouter les tâches types de la saison</button>
  </div>
</section>

<!-- RUCHES -->
<section id="t-ruches" class="tabv">
  <div id="listeRuches"></div>
  <div class="card">
    <b>Nouvelle ruche</b>
    <input id="nr-nom" placeholder="Nom (ex: Ruche 3)">
    <select id="nr-orig">
      <option>Nucléi</option><option>Essaim</option><option>Division</option>
      <option>Colonie achetée</option><option>Reine achetée</option><option>Autre</option>
    </select>
    <input id="nr-date" type="date">
    <textarea id="nr-notes" rows="2" placeholder="Notes (reine, couleur, emplacement...)"></textarea>
    <button class="p" onclick="ajoutRuche()">Ajouter</button>
  </div>
</section>

<!-- MIEL -->
<section id="t-miel" class="tabv">
  <div class="card" id="statsMiel"></div>
  <div id="listeRecoltes"></div>
  <div class="card">
    <b>Nouvelle récolte</b>
    <select id="nm-ruche"></select>
    <input id="nm-date" type="date">
    <input id="nm-poids" type="number" step="0.1" inputmode="decimal" placeholder="Poids (kg)">
    <button class="p" onclick="ajoutRecolte()">Ajouter</button>
  </div>
</section>

<!-- PRATIQUES -->
<section id="t-prat" class="tabv">
  <input id="rech" type="search" placeholder="🔍 Mot-clé (reine, nucléi, division, varroa...)" oninput="rendrePratiques()">
  <div id="listePrat"></div>
</section>

<!-- SAUVEGARDE -->
<section id="t-plus" class="tabv">
  <div class="card">
    <b>Sauvegarde</b>
    <p class="small">Les données restent sur ton iPhone. Fais une sauvegarde de temps en temps.</p>
    <button class="p" onclick="exportJSON()">⬇️ Exporter mes données</button>
    <p></p>
    <input type="file" id="imp" accept=".json" onchange="importJSON(event)">
  </div>
</section>
</main>

<nav>
  <button class="on" onclick="go('cal',this)"><span>📅</span>Calendrier</button>
  <button onclick="go('ruches',this)"><span>🐝</span>Ruches</button>
  <button onclick="go('miel',this)"><span>🍯</span>Miel</button>
  <button onclick="go('prat',this)"><span>📖</span>Pratiques</button>
  <button onclick="go('plus',this)"><span>⚙️</span>Plus</button>
</nav>

<script>
/* ---------- DONNÉES ---------- */
const KEY='celiflore_v1';
let D=JSON.parse(localStorage.getItem(KEY)||'null')||{
  ruches:[{id:1,nom:'Ruche 1',origine:'Nucléi',date:'',notes:''},{id:2,nom:'Ruche 2',origine:'Nucléi',date:'',notes:''}],
  taches:[],recoltes:[]
};
const save=()=>localStorage.setItem(KEY,JSON.stringify(D));
const uid=()=>Date.now()+Math.floor(Math.random()*1000);
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const fmt=s=>s?new Date(s+'T12:00').toLocaleDateString('fr-CA',{day:'numeric',month:'short',year:'numeric'}):'';
let sel=iso(new Date()), vue=new Date(); vue.setDate(1);

/* ---------- NAV ---------- */
const titres={cal:'🐝 Calendrier',ruches:'🐝 Mes ruches',miel:'🍯 Miel',prat:'📖 Bonnes pratiques',plus:'⚙️ Plus'};
function go(t,b){
  document.querySelectorAll('.tabv').forEach(e=>e.classList.remove('on'));
  document.getElementById('t-'+t).classList.add('on');
  document.querySelectorAll('nav button').forEach(e=>e.classList.remove('on'));
  b.classList.add('on');
  document.getElementById('titre').textContent=titres[t];
  render();
}

/* ---------- CALENDRIER ---------- */
function moisPrec(){vue.setMonth(vue.getMonth()-1);rendreCal()}
function moisSuiv(){vue.setMonth(vue.getMonth()+1);rendreCal()}

function anPasse(t){
  const y=parseInt(t.date.slice(0,4))-1;
  return D.taches.find(x=>x.fait&&x.titre.trim().toLowerCase()===t.titre.trim().toLowerCase()&&parseInt(x.date.slice(0,4))===y);
}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function ligneTache(t){
  const p=anPasse(t);
  return `<div class="card"><div class="row">
    <input type="checkbox" style="width:26px;height:26px;margin:0" ${t.fait?'checked':''} onchange="toggleTache(${t.id})">
    <div class="grow">
      <div class="${t.fait?'done':''}"><b>${esc(t.titre)}</b></div>
      <div class="small">${t.ruche?esc(t.ruche):'Toutes les ruches'} • ${fmt(t.date)}</div>
      ${t.notes?`<div class="small">${esc(t.notes)}</div>`:''}
      ${p?`<div class="ly">🕓 L'an dernier : ${fmt(p.dateFait||p.date)}</div>`:''}
    </div>
    <button class="x" onclick="supTache(${t.id})">🗑</button>
  </div></div>`;
}

function prochainWeekend(){
  const n=new Date(); n.setHours(0,0,0,0);
  const j=n.getDay();
  let sam=new Date(n);
  if(j===0) sam.setDate(n.getDate()-1);
  else sam.setDate(n.getDate()+(6-j));
  const dim=new Date(sam); dim.setDate(sam.getDate()+1);
  return [iso(sam),iso(dim)];
}
function rendreWeekend(){
  const [s,d]=prochainWeekend();
  const l=D.taches.filter(t=>!t.fait&&t.date>=s&&t.date<=d).sort((a,b)=>a.date.localeCompare(b.date));
  document.getElementById('weekend').innerHTML=
    `<b>📌 À faire ce prochain week-end</b> <span class="small">(${fmt(s)} – ${fmt(d)})</span>`+
    (l.length?l.map(t=>{const p=anPasse(t);return `<div style="margin-top:6px">• ${esc(t.titre)} ${t.ruche?'('+esc(t.ruche)+')':''}${p?`<div class="ly">L'an dernier : ${fmt(p.dateFait||p.date)}</div>`:''}</div>`}).join(''):'<div class="small" style="margin-top:6px">Rien de prévu 🎉</div>');
}
function rendreCal(){
  const y=vue.getFullYear(),m=vue.getMonth();
  document.getElementById('moisLabel').textContent=vue.toLocaleDateString('fr-CA',{month:'long',year:'numeric'});
  let h=['L','M','M','J','V','S','D'].map(x=>`<div class="h">${x}</div>`).join('');
  const first=(new Date(y,m,1).getDay()+6)%7, nb=new Date(y,m+1,0).getDate();
  for(let i=0;i<first;i++)h+='<div></div>';
  const today=iso(new Date());
  for(let d=1;d<=nb;d++){
    const s=iso(new Date(y,m,d));
    const ts=D.taches.filter(t=>t.date===s);
    const dot=ts.length?`<span class="dot ${ts.some(t=>!t.fait)?'todo':''}"></span>`:'';
    h+=`<div class="d ${s===today?'today':''} ${s===sel?'sel':''}" onclick="choisir('${s}')">${d}${dot}</div>`;
  }
  document.getElementById('cal').innerHTML=h;
  document.getElementById('jourLabel').textContent='Tâches du '+fmt(sel);
  const ts=D.taches.filter(t=>t.date===sel);
  document.getElementById('tachesJour').innerHTML=ts.length?ts.map(ligneTache).join(''):'<div class="small">Aucune tâche ce jour.</div>';
  document.getElementById('nt-date').value=sel;
  rendreWeekend();
}
function choisir(s){sel=s;rendreCal()}
function ajoutTache(){
  const titre=document.getElementById('nt-titre').value.trim(); if(!titre)return;
  D.taches.push({id:uid(),titre,date:document.getElementById('nt-date').value||sel,
    ruche:document.getElementById('nt-ruche').value,notes:document.getElementById('nt-notes').value,fait:false});
  document.getElementById('nt-titre').value='';document.getElementById('nt-notes').value='';
  save();render();
}
function toggleTache(id){const t=D.taches.find(x=>x.id===id);t.fait=!t.fait;t.dateFait=t.fait?iso(new Date()):null;save();render()}
function supTache(id){if(confirm('Supprimer cette tâche ?')){D.taches=D.taches.filter(x=>x.id!==id);save();render()}}

/* Tâches types (année en cours) */
const TYPES=[['Vérification hivernale (écoute/poids)',2,15],['Première inspection de printemps',3,25],['Nourrissement printemps (sirop 1:1)',4,5],
['Installation nucléi / reine achetée',5,10],['Inspection anti-essaimage',5,20],['Ajout de hausses',6,5],['Division (si colonie forte)',6,10],
['Récolte du miel',8,1],['Comptage + traitement varroa',8,15],['Nourrissement automne (sirop 2:1)',9,15],['Fermeture / hivernage',10,25]];
function modeles(){
  const y=new Date().getFullYear();let n=0;
  TYPES.forEach(([t,m,d])=>{const date=iso(new Date(y,m-1,d));
    if(!D.taches.some(x=>x.titre===t&&x.date===date)){D.taches.push({id:uid(),titre:t,date,ruche:'',notes:'',fait:false});n++}});
  save();render();alert(n+' tâche(s) ajoutée(s) pour '+y);
}

/* Export .ics (vraies alertes dans Calendrier iPhone) */
function exportICS(){
  const l=D.taches.filter(t=>!t.fait);
  if(!l.length){alert('Aucune tâche à exporter');return}
  let s='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Celiflore//FR\r\n';
  l.forEach(t=>{const d=t.date.replace(/-/g,'');
    const nx=new Date(t.date+'T12:00');nx.setDate(nx.getDate()+1);
    s+=`BEGIN:VEVENT\r\nUID:${t.id}@celiflore\r\nDTSTAMP:${iso(new Date()).replace(/-/g,'')}T000000Z\r\nDTSTART;VALUE=DATE:${d}\r\nDTEND;VALUE=DATE:${iso(nx).replace(/-/g,'')}\r\nSUMMARY:🐝 ${t.titre}${t.ruche?' ('+t.ruche+')':''}\r\nBEGIN:VALARM\r\nTRIGGER:-P1DT-9H\r\nACTION:DISPLAY\r\nDESCRIPTION:${t.titre}\r\nEND:VALARM\r\nEND:VEVENT\r\n`});
  s+='END:VCALENDAR';
  tel(s,'celiflore.ics','text/calendar');
}

/* ---------- RUCHES ---------- */
function majSelects(){
  const o='<option value="">Toutes les ruches</option>'+D.ruches.map(r=>`<option>${esc(r.nom)}</option>`).join('');
  document.getElementById('nt-ruche').innerHTML=o;
  document.getElementById('nm-ruche').innerHTML=D.ruches.map(r=>`<option>${esc(r.nom)}</option>`).join('');
  document.getElementById('suggest').innerHTML=[...new Set([...TYPES.map(t=>t[0]),...D.taches.map(t=>t.titre)])].map(t=>`<option value="${esc(t)}">`).join('');
}
function rendreRuches(){
  document.getElementById('listeRuches').innerHTML=D.ruches.map(r=>{
    const kg=D.recoltes.filter(x=>x.ruche===r.nom).reduce((a,b)=>a+b.poids,0);
    return `<div class="card"><div class="row"><div class="grow">
      <b>🐝 ${esc(r.nom)}</b>
      <div class="small">${esc(r.origine)}${r.date?' • depuis '+fmt(r.date):''}</div>
      ${r.notes?`<div class="small">${esc(r.notes)}</div>`:''}
      <div class="small">🍯 Total récolté : ${kg.toFixed(1)} kg</div>
    </div><button class="x" onclick="supRuche(${r.id})">🗑</button></div></div>`}).join('');
}
function ajoutRuche(){
  const nom=document.getElementById('nr-nom').value.trim();if(!nom)return;
  D.ruches.push({id:uid(),nom,origine:document.getElementById('nr-orig').value,date:document.getElementById('nr-date').value,notes:document.getElementById('nr-notes').value});
  ['nr-nom','nr-notes','nr-date'].forEach(i=>document.getElementById(i).value='');
  save();render();
}
function supRuche(id){if(confirm('Supprimer cette ruche ?')){D.ruches=D.ruches.filter(x=>x.id!==id);save();render()}}

/* ---------- MIEL ---------- */
function rendreMiel(){
  const par={};D.recoltes.forEach(r=>{const y=r.date.slice(0,4);par[y]=(par[y]||0)+r.poids});
  const tot=D.recoltes.reduce((a,b)=>a+b.poids,0);
  document.getElementById('statsMiel').innerHTML=`<b>Total : ${tot.toFixed(1)} kg 🍯</b>`+
    Object.keys(par).sort().reverse().map(y=>`<div class="small">${y} : ${par[y].toFixed(1)} kg</div>`).join('');
  document.getElementById('listeRecoltes').innerHTML=[...D.recoltes].sort((a,b)=>b.date.localeCompare(a.date)).map(r=>
    `<div class="card row"><div class="grow"><b>${esc(r.ruche)}</b><div class="small">${fmt(r.date)}</div></div>
     <b>${r.poids.toFixed(1)} kg</b><button class="x" onclick="supRec(${r.id})">🗑</button></div>`).join('');
  document.getElementById('nm-date').value=iso(new Date());
}
function ajoutRecolte(){
  const p=parseFloat(document.getElementById('nm-poids').value.replace(',','.'));if(!p)return;
  D.recoltes.push({id:uid(),ruche:document.getElementById('nm-ruche').value,date:document.getElementById('nm-date').value||iso(new Date()),poids:p});
  document.getElementById('nm-poids').value='';save();render();
}
function supRec(id){if(confirm('Supprimer ?')){D.recoltes=D.recoltes.filter(x=>x.id!==id);save();render()}}

/* ---------- BONNES PRATIQUES ---------- */
const PRAT=[
{p:'Février',t:'Vérifier la survie hivernale',pts:['Ne pas ouvrir si < 10 °C','Écouter le bourdonnement (oreille/stéthoscope)','Soulever l\'arrière de la ruche : sentir le poids des réserves','Réserves faibles : fondant ou pain de sucre sur les cadres','Nettoyer l\'entrée des abeilles mortes (normal)'],k:['hiver','survie','février','fondant','réserves','mortalité','poids']},
{p:'Mars',t:'Première inspection de printemps',pts:['Jour > 12–15 °C, sans vent','Chercher œufs frais = reine présente','Nettoyer le plancher, retirer cadres moisis','Sirop 1:1 si réserves faibles','Noter la force de la colonie'],k:['printemps','reine','oeufs','nettoyage','sirop','inspection','plancher']},
{p:'Avril',t:'Colonie orpheline (sans reine)',pts:['Signes : aucun œuf, bruit agité, cellules d\'urgence','Option 1 : acheter une reine mariée, l\'introduire en cage','Option 2 : réunir avec une colonie forte (papier journal)','Libérer la reine après 5–7 jours','Vérifier la ponte après 1–2 semaines'],k:['reine','orpheline','achat','introduction','réunion','cage','sans reine']},
{p:'Avril–Mai',t:'Acheter / installer une reine',pts:['Commander tôt (printemps)','Retirer l\'ancienne reine 24 h avant si remplacement','Cage de transport dans la ruche, bouchon candi','Ne pas déranger 7 jours','Vérifier acceptation puis ponte'],k:['reine','achat','remplacement','installation','candi','cage']},
{p:'Avril–Mai',t:'Installer un nucléi acheté',pts:['Transférer les cadres dans le même ordre, au centre','Compléter avec cadres cirés','Sirop 1:1 en nourrisseur','Réduire l\'entrée au début','Inspecter après 7–10 jours (ponte, couvain)'],k:['nucléi','nuc','achat','installation','démarrage','sirop','cadres']},
{p:'Mai',t:'Prévenir l\'essaimage',pts:['Inspection aux 7–10 jours','Chercher les cellules royales','Ajouter une hausse avant que la ruche soit pleine','Bien aérer, éviter la congestion','Cellules royales présentes : division préventive'],k:['essaim','essaimage','cellules royales','hausse','espace','congestion']},
{p:'Mai–Juin',t:'Faire une division',pts:['Colonie forte (8+ cadres d\'abeilles)','Prendre 3–4 cadres (couvain, miel, abeilles) + 1 cadre d\'œufs','Installer dans une nouvelle ruche, entrée réduite','Donner une reine achetée ou laisser élever la sienne','Nourrir 1:1, ne pas déranger 3 semaines si élevage de reine'],k:['division','split','multiplier','nouvelle colonie','reine','augmenter','ruche 3','ruche 4']},
{p:'Mai–Juin',t:'Capturer un essaim',pts:['Prévoir boîte/nuc, drap, sécateur','Secouer l\'essaim dans la boîte, repérer la reine','Installer le soir, nourrir au sirop 1:1','Traiter varroa après 2–3 semaines'],k:['essaim','capture','récupération','nouvelle colonie']},
{p:'Juin–Juillet',t:'Miellée et hausses',pts:['Ajouter hausses selon le flux de nectar','Cadres operculés à ~80 % = prêts','Garder assez de réserves dans le corps','Surveiller l\'espace régulièrement'],k:['miellée','hausse','nectar','opercule','espace']},
{p:'Juillet–Août',t:'Récolte du miel',pts:['Humidité < 18,5 % (réfractomètre)','Retirer les hausses (chasse-abeilles ou brosse)','Extraire à chaud (~30 °C)','Filtrer, reposer 48 h, mettre en pots','Laisser 20–25 kg de réserves pour l\'hiver'],k:['récolte','extraction','miel','humidité','pots','hausse','réfractomètre']},
{p:'Août',t:'Traitement varroa',pts:['Compter les varroas (lavage alcool/sucre)','Traiter après la récolte','Respecter température et mode d\'emploi du produit','Recompter après traitement pour valider l\'efficacité'],k:['varroa','traitement','acariens','parasite','comptage','santé']},
{p:'Septembre',t:'Nourrissement d\'automne',pts:['Sirop 2:1 pour constituer les réserves','Viser ~20–25 kg de réserves au total','Réduire l\'entrée (souris, pillage)','Réunir les colonies faibles'],k:['nourrissement','sirop','automne','réserves','pillage','souris']},
{p:'Octobre–Novembre',t:'Fermeture / hivernage',pts:['Réducteur d\'entrée + grillage anti-souris','Ventilation en haut (isolant respirant)','Protéger du vent (emballage/isolation selon région)','Légère inclinaison vers l\'avant (écoulement)','Ne plus ouvrir jusqu\'en février'],k:['hiver','hivernage','fermeture','isolation','ventilation','souris','emballage']}
];
function rendrePratiques(){
  const q=(document.getElementById('rech').value||'').toLowerCase().trim();
  const l=PRAT.filter(x=>!q||[x.t,x.p,...x.k,...x.pts].some(s=>s.toLowerCase().includes(q)));
  document.getElementById('listePrat').innerHTML=l.length?l.map(x=>`<div class="card">
    <div class="ly">${x.p}</div><b>${x.t}</b><ul>${x.pts.map(p=>`<li>${p}</li>`).join('')}</ul>
    ${x.k.map(k=>`<span class="tag" onclick="document.getElementById('rech').value='${k}';rendrePratiques()">#${k}</span>`).join('')}</div>`).join(''):'<div class="small">Aucun résultat.</div>';
}

/* ---------- SAUVEGARDE ---------- */
function tel(contenu,nom,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([contenu],{type}));a.download=nom;a.click()}
function exportJSON(){tel(JSON.stringify(D),'celiflore-sauvegarde.json','application/json')}
function importJSON(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{D=JSON.parse(r.result);save();render();alert('Données importées ✅')}catch{alert('Fichier invalide')}};r.readAsText(f)}

/* ---------- RENDU ---------- */
function render(){majSelects();rendreCal();rendreRuches();rendreMiel();rendrePratiques()}
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
